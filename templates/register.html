{% extends "base.html" %}
{% block title %}Đăng ký - Garena Checker{% endblock %}

{% block content %}
<main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px 20px;">
  <div style="width: 100%; max-width: 460px; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(226, 232, 240, 0.8); border-radius: 24px; padding: 40px; box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.08);">
    
    <div style="text-align: center; margin-bottom: 30px;">
      <div style="display: inline-flex; align-items: center; justify-content: center; padding: 16px; background-color: rgba(16, 185, 129, 0.08); border-radius: 16px; margin-bottom: 16px;">
        <i class="fa-solid fa-user-plus" style="color: #10b981; font-size: 28px;"></i>
      </div>
      <h3 style="font-weight: 800; color: #0f172a; margin: 0 0 4px 0; font-size: 22px;">Đăng ký tài khoản</h3>
      <p style="color: #64748b; font-size: 13px; margin: 0;">Tạo tài khoản miễn phí - <strong>100 lượt check/ngày</strong></p>
    </div>

    <div id="alertBox" style="display: none;"></div>

    <form id="registerForm" onsubmit="handleRegister(event)">
      <div style="margin-bottom: 14px;">
        <label style="display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 6px;">Tên đăng nhập</label>
        <div style="position: relative;">
          <i class="fa-solid fa-user" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 14px;"></i>
          <input name="username" type="text" required minlength="3" placeholder="Ít nhất 3 ký tự" style="width: 100%; height: 46px; padding: 0 20px 0 44px; border-radius: 12px; border: 1.5px solid #cbd5e1; font-size: 14px; background: #fff; color: #0f172a; outline: none; box-sizing: border-box; transition: all 0.2s;">
        </div>
      </div>

      <div style="margin-bottom: 14px;">
        <label style="display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 6px;">Email</label>
        <div style="position: relative;">
          <i class="fa-solid fa-envelope" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 14px;"></i>
          <input name="email" type="email" required placeholder="example@email.com" style="width: 100%; height: 46px; padding: 0 20px 0 44px; border-radius: 12px; border: 1.5px solid #cbd5e1; font-size: 14px; background: #fff; color: #0f172a; outline: none; box-sizing: border-box; transition: all 0.2s;">
        </div>
      </div>

      <div style="margin-bottom: 14px;">
        <label style="display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 6px;">Mật khẩu</label>
        <div style="position: relative;">
          <i class="fa-solid fa-lock" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 14px;"></i>
          <input name="password" type="password" required minlength="6" placeholder="Ít nhất 6 ký tự" style="width: 100%; height: 46px; padding: 0 20px 0 44px; border-radius: 12px; border: 1.5px solid #cbd5e1; font-size: 14px; background: #fff; color: #0f172a; outline: none; box-sizing: border-box; transition: all 0.2s;">
        </div>
      </div>

      <div style="margin-bottom: 20px;">
        <label style="display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 6px;">Xác nhận mật khẩu</label>
        <div style="position: relative;">
          <i class="fa-solid fa-lock" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 14px;"></i>
          <input name="confirm_password" type="password" required minlength="6" placeholder="Nhập lại mật khẩu" style="width: 100%; height: 46px; padding: 0 20px 0 44px; border-radius: 12px; border: 1.5px solid #cbd5e1; font-size: 14px; background: #fff; color: #0f172a; outline: none; box-sizing: border-box; transition: all 0.2s;">
        </div>
      </div>

      <button type="submit" id="regBtn" class="btn-primary" style="width: 100%; height: 46px; justify-content: center; font-size: 15px; background: #10b981;">
        <i class="fa-solid fa-user-plus"></i> Đăng ký
      </button>
    </form>

    <div style="text-align: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid #edf2f7;">
      <p style="color: #64748b; font-size: 13px; margin: 0;">
        Đã có tài khoản? <a href="{{ url_for('login_page') }}" style="color: #3b82f6; font-weight: 700; text-decoration: none;">Đăng nhập</a>
      </p>
    </div>
  </div>
</main>

<style>
  input:focus { border-color: #10b981 !important; box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15) !important; }
</style>

<script>
  async function handleRegister(e) {
    e.preventDefault();
    const btn = document.getElementById('regBtn');
    const alertBox = document.getElementById('alertBox');
    const pw = e.target.password.value;
    const cpw = e.target.confirm_password.value;

    alertBox.style.display = 'none';

    if (pw !== cpw) {
      alertBox.style.display = 'block';
      alertBox.innerHTML = '<div class="alert alert-danger">Mật khẩu xác nhận không khớp!</div>';
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang đăng ký...';

    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: e.target.username.value.trim(),
          email: e.target.email.value.trim(),
          password: pw,
        })
      });
      const data = await res.json();
      if (data.success) {
        window.location.href = '/dashboard';
      } else {
        alertBox.style.display = 'block';
        alertBox.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
      }
    } catch (err) {
      alertBox.style.display = 'block';
      alertBox.innerHTML = '<div class="alert alert-danger">Lỗi kết nối. Vui lòng thử lại.</div>';
    }
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Đăng ký';
  }
</script>
{% endblock %}
